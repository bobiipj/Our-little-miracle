<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Parisienne&family=Playfair+Display:ital,wght@0,600;1,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{
  position:relative;
  background:
    radial-gradient(ellipse at 22% 10%, rgba(233,200,116,0.10), transparent 55%),
    radial-gradient(ellipse at 82% 15%, rgba(155,140,220,0.14), transparent 50%),
    linear-gradient(180deg, #070a1c 0%, #0c1230 45%, #141b45 100%);
  font-family:'Cormorant Garamond', serif;
  color:#f6efe0;
}
.stars{position:absolute;inset:0;}
.stars span{
  position:absolute;
  width:2px;height:2px;
  background:#f6efe0;
  border-radius:50%;
  box-shadow:0 0 6px 1px rgba(246,239,224,0.7);
}
.moon{
  position:absolute;
  top:60px; right:110px;
  width:150px; height:150px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fffaee 0%, #f3dfa0 55%, #c9a45c 100%);
  box-shadow:0 0 70px rgba(243,223,160,0.45);
}
.content{
  position:relative;
  z-index:2;
  text-align:center;
  padding-top:150px;
}
.eyebrow{
  letter-spacing:0.35em;
  color:#f3dfa0;
  font-size:20px;
  margin-bottom:14px;
}
.title{
  font-family:'Playfair Display', serif;
  font-weight:600;
  font-style:italic;
  font-size:88px;
  color:#f6efe0;
  text-shadow:0 0 40px rgba(233,200,116,0.3);
  margin-bottom:8px;
}
.names{
  font-family:'Parisienne', cursive;
  font-size:52px;
  color:#f3dfa0;
  margin-bottom:14px;
}
.tagline{
  font-size:26px;
  font-style:italic;
  letter-spacing:0.04em;
  color:#c9c6ea;
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="content">
  <div class="eyebrow">✧ ✦ ✧</div>
  <div class="title">Our Little Miracle</div>
  <div class="names">Bobin &amp; Amrutha</div>
  <div class="tagline">A baby shower under the stars &middot; September 4, 2026</div>
</div>
<script>
const box = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const s = document.createElement('span');
  s.style.left = Math.random() * 1200 + 'px';
  s.style.top = Math.random() * 630 + 'px';
  s.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
  const scale = Math.random() * 1.4 + 0.4;
  s.style.transform = 'scale(' + scale.toFixed(2) + ')';
  box.appendChild(s);
}
</script>
</body>
</html>
